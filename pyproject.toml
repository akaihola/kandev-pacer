[build-system]
requires = ["uv_build>=0.11.26,<0.12"]
build-backend = "uv_build"

[project]
name = "kandev-pacer"
version = "0.1.0"
description = "Pace Kandev task execution against subscription quota windows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["websocket-client"]

[project.scripts]
kandev-pacer = "kandev_pacer.runtime:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
