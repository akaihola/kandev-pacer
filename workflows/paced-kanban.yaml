# Paced Kanban configured for design 13 (docs/pacing-designs.md):
# - In Progress no longer auto-starts; the pacer launches turns instead.
# - In Progress keeps its on_turn_complete route, which is what marks it
#   as a work step for the pacer's routing-derived classifier.
# - Backlog stays the parked start step (the quota queue); the pacer
#   admits from it with session.launch into In Progress.
# - Review/Done keep their on_turn_start rules that re-queue manual
#   re-prompts back into Backlog.
# stage_type is not settable via import, API, or UI - it is omitted here.
# On the live gogo instance it was set by direct SQLite update on
# 2026-07-24 (In Progress = "work", Review = "review"). Re-importing this
# file recreates the steps and silently resets stage_type to "custom",
# so re-run the pacing adapter after any import (it also strips any
# auto_start_agent the import or a UI edit brought back):
#   ./make_paced.py 'Paced Kanban' --apply
version: 1
type: kandev_workflow
workflows:
    - name: Paced Kanban
      description: Paced board. Tasks queue in Backlog; the pacer admits them into In Progress and launches the agent when quota allows; finished work moves to Review.
      steps:
        - name: Backlog
          position: 0
          color: bg-neutral-400
          events: {}
          is_start_step: true
          show_in_command_panel: false
          allow_manual_move: true
          auto_advance_requires_signal: false
        - name: In Progress
          position: 1
          color: bg-blue-500
          events:
            on_turn_complete:
                - type: move_to_step
                  config:
                    step_position: 2
          is_start_step: false
          show_in_command_panel: true
          allow_manual_move: true
          auto_advance_requires_signal: false
        - name: Review
          position: 2
          color: bg-yellow-500
          events:
            on_turn_start:
                - type: move_to_step
                  config:
                    step_position: 0
          is_start_step: false
          show_in_command_panel: true
          allow_manual_move: true
          auto_advance_requires_signal: false
        - name: Done
          position: 3
          color: bg-green-500
          events:
            on_turn_start:
                - type: move_to_step
                  config:
                    step_position: 0
          is_start_step: false
          show_in_command_panel: false
          allow_manual_move: true
          auto_advance_requires_signal: false
